spring.application.name=care-booking-backend


server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/care_booking?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Taipei
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.jackson.time-zone=Asia/Taipei

app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=15
app.jwt.refresh-days=7

app.cors-origin=http://localhost:5174

# 僅供本機教學，正式環境關閉
app.seed-demo=true